---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: stackitnodeclasses.karpenter.k8s.stackit
spec:
  group: karpenter.k8s.stackit
  names:
    categories:
    - karpenter
    kind: StackitNodeClass
    listKind: StackitNodeClassList
    plural: stackitnodeclasses
    shortNames:
    - snc
    - sncs
    singular: stackitnodeclass
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    - jsonPath: .spec.availabilityZones
      name: Zones
      priority: 1
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: StackitNodeClass is the Schema for the StackitNodeClass API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              StackitNodeClassSpec is the top level specification for the STACKIT Karpenter provider. It holds
              everything Karpenter needs to turn a NodeClaim into a STACKIT IaaS server.

              The STACKIT region and project are deliberately not part of this spec: both are operator-level
              settings (--region / --project-id), because the cloud-controller-manager takes its region from
              its own config and stamps it onto every node as topology.kubernetes.io/region. A NodeClass that
              could choose a different region would produce nodes whose region label contradicts the CCM.
            properties:
              affinityGroup:
                description: |-
                  affinityGroup is the UUID of a STACKIT affinity group to place servers in. Use a group with
                  an anti-affinity policy to spread nodes across STACKIT hosts.
                pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
                type: string
              availabilityZones:
                description: |-
                  availabilityZones restricts the STACKIT availability zones that servers may be launched into,
                  e.g. ["eu01-1", "eu01-2"]. All of them must belong to the region the controller is configured
                  with. When empty, every availability zone the API reports for that region is a candidate.
                items:
                  type: string
                type: array
                x-kubernetes-list-type: set
              bootVolume:
                description: bootVolume configures the root disk created for every
                  server.
                properties:
                  deleteOnTermination:
                    default: true
                    description: |-
                      deleteOnTermination controls whether the boot volume is deleted along with the server.
                      Defaults to true. Setting it to false leaks a billable volume for every node Karpenter
                      terminates, and those volumes are not tracked or cleaned up by this provider.
                    type: boolean
                  performanceClass:
                    description: |-
                      performanceClass of the root disk, e.g. "storage_premium_perf1". Available classes are
                      project- and region-specific; list them with the IaaS API's volume-performance-classes
                      endpoint. When unset, STACKIT's project default applies.
                    pattern: ^[A-Za-z0-9]+([ /._-]*[A-Za-z0-9]+)*$
                    type: string
                  size:
                    description: size is the root disk size in gigabytes. It must
                      be at least as large as the source image.
                    format: int64
                    maximum: 8192
                    minimum: 1
                    type: integer
                  source:
                    description: source is what the root disk is created from — normally
                      an image.
                    properties:
                      id:
                        description: id of the source resource.
                        pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
                        type: string
                      type:
                        default: image
                        description: type of the source resource.
                        enum:
                        - image
                        - volume
                        - snapshot
                        - backup
                        type: string
                    required:
                    - id
                    type: object
                required:
                - size
                - source
                type: object
              keypairName:
                description: keypairName is the name of a STACKIT SSH keypair authorized
                  on the server.
                type: string
              kubelet:
                description: |-
                  kubelet defines args used when configuring kubelet on provisioned nodes. They are a subset of
                  the upstream types, recognizing not all options may be supported. Karpenter only uses these
                  to compute allocatable capacity; applying them to the node itself is the responsibility of
                  the bootstrap script in userData.
                properties:
                  clusterDNS:
                    description: clusterDNS is a list of IP addresses for the cluster
                      DNS server.
                    items:
                      type: string
                    type: array
                  cpuCFSQuota:
                    description: cpuCFSQuota enables CPU CFS quota enforcement for
                      containers that specify CPU limits.
                    type: boolean
                  evictionHard:
                    additionalProperties:
                      type: string
                    description: evictionHard is the map of signal names to quantities
                      that define hard eviction thresholds.
                    type: object
                    x-kubernetes-validations:
                    - message: valid keys for evictionHard are ['memory.available','nodefs.available','nodefs.inodesFree','imagefs.available','imagefs.inodesFree','pid.available']
                      rule: self.all(x, x in ['memory.available','nodefs.available','nodefs.inodesFree','imagefs.available','imagefs.inodesFree','pid.available'])
                  evictionMaxPodGracePeriod:
                    description: |-
                      evictionMaxPodGracePeriod is the maximum allowed grace period (in seconds) to use when
                      terminating pods in response to soft eviction thresholds being met.
                    format: int32
                    type: integer
                  evictionSoft:
                    additionalProperties:
                      type: string
                    description: evictionSoft is the map of signal names to quantities
                      that define soft eviction thresholds.
                    type: object
                    x-kubernetes-validations:
                    - message: valid keys for evictionSoft are ['memory.available','nodefs.available','nodefs.inodesFree','imagefs.available','imagefs.inodesFree','pid.available']
                      rule: self.all(x, x in ['memory.available','nodefs.available','nodefs.inodesFree','imagefs.available','imagefs.inodesFree','pid.available'])
                  evictionSoftGracePeriod:
                    additionalProperties:
                      type: string
                    description: |-
                      evictionSoftGracePeriod is the map of signal names to quantities that define grace periods for
                      each eviction signal.
                    type: object
                    x-kubernetes-validations:
                    - message: valid keys for evictionSoftGracePeriod are ['memory.available','nodefs.available','nodefs.inodesFree','imagefs.available','imagefs.inodesFree','pid.available']
                      rule: self.all(x, x in ['memory.available','nodefs.available','nodefs.inodesFree','imagefs.available','imagefs.inodesFree','pid.available'])
                  kubeReserved:
                    additionalProperties:
                      type: string
                    description: kubeReserved contains resources reserved for Kubernetes
                      system components.
                    type: object
                    x-kubernetes-validations:
                    - message: valid keys for kubeReserved are ['cpu','memory','ephemeral-storage','pid']
                      rule: self.all(x, x=='cpu' || x=='memory' || x=='ephemeral-storage'
                        || x=='pid')
                    - message: kubeReserved value cannot be a negative resource quantity
                      rule: self.all(x, !self[x].startsWith('-'))
                  maxPods:
                    description: maxPods is an override for the maximum number of
                      pods that can run on a worker node instance.
                    format: int32
                    minimum: 0
                    type: integer
                  podsPerCore:
                    description: |-
                      podsPerCore is an override for the number of pods that can run on a worker node instance based
                      on the number of cpu cores. This value cannot exceed maxPods, so, if maxPods is a lower value,
                      that value will be used.
                    format: int32
                    minimum: 0
                    type: integer
                  systemReserved:
                    additionalProperties:
                      type: string
                    description: systemReserved contains resources reserved for OS
                      system daemons and kernel memory.
                    type: object
                    x-kubernetes-validations:
                    - message: valid keys for systemReserved are ['cpu','memory','ephemeral-storage','pid']
                      rule: self.all(x, x=='cpu' || x=='memory' || x=='ephemeral-storage'
                        || x=='pid')
                    - message: systemReserved value cannot be a negative resource
                        quantity
                      rule: self.all(x, !self[x].startsWith('-'))
                type: object
                x-kubernetes-validations:
                - message: evictionSoft OwnerKey does not have a matching evictionSoftGracePeriod
                  rule: has(self.evictionSoft) ? self.evictionSoft.all(e, (e in self.evictionSoftGracePeriod)):true
                - message: evictionSoftGracePeriod OwnerKey does not have a matching
                    evictionSoft
                  rule: has(self.evictionSoftGracePeriod) ? self.evictionSoftGracePeriod.all(e,
                    (e in self.evictionSoft)):true
              labels:
                additionalProperties:
                  type: string
                description: |-
                  labels are additional STACKIT server labels applied to every server. Keys reserved by this
                  provider for server discovery (karpenter.sh/managed-by, karpenter.sh/nodepool,
                  karpenter.sh/nodeclaim and karpenter.k8s.stackit/nodeclass) are rejected.
                type: object
              networking:
                description: |-
                  networking attaches the server to a network. STACKIT's v2 IaaS API requires a server to be
                  created with either a network or an explicit set of pre-created NICs.
                properties:
                  networkID:
                    description: |-
                      networkID is the UUID of the network to attach the server to. STACKIT allocates a NIC on
                      this network automatically. Mutually exclusive with nicIDs.
                    pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
                    type: string
                  nicIDs:
                    description: |-
                      nicIDs are UUIDs of pre-created network interfaces to attach. Mutually exclusive with
                      networkID. Since a NIC can only be attached to one server, this is only useful for a
                      NodePool that will ever hold a single node, and is offered mainly for completeness.
                    items:
                      type: string
                    type: array
                    x-kubernetes-list-type: set
                type: object
              securityGroups:
                description: securityGroups are the IDs of security groups attached
                  to the server.
                items:
                  type: string
                type: array
                x-kubernetes-list-type: set
              serverNamePrefix:
                description: |-
                  serverNamePrefix is prepended to the generated name of every server. STACKIT server names
                  must be a DNS-style label sequence and are limited to 63 characters; the generated suffix
                  takes 21 of them.
                maxLength: 32
                pattern: ^[A-Za-z0-9]([A-Za-z0-9-]*[A-Za-z0-9])?$
                type: string
              serviceAccountMails:
                description: |-
                  serviceAccountMails are the mail addresses of STACKIT service accounts attached to the
                  server, which is how a node obtains STACKIT API credentials without a static key.
                items:
                  type: string
                type: array
                x-kubernetes-list-type: set
              userData:
                description: |-
                  userData is cloud-init user data passed to the server. This is where the node is joined to
                  the cluster: without it a server boots but never registers, and Karpenter will garbage
                  collect it after the registration TTL.
                type: string
            required:
            - bootVolume
            - networking
            type: object
          status:
            description: StackitNodeClassStatus contains the resolved state of the
              StackitNodeClass.
            properties:
              availabilityZones:
                description: |-
                  availabilityZones contains the zones resolved from spec.availabilityZones that STACKIT
                  reports for the configured region. Offerings are only created for these zones.
                items:
                  description: AvailabilityZone is a resolved STACKIT availability
                    zone that servers may be launched into.
                  properties:
                    id:
                      description: id of the availability zone, e.g. "eu01-1".
                      type: string
                  required:
                  - id
                  type: object
                type: array
              conditions:
                description: conditions contains signals for health and readiness.
                items:
                  description: Condition aliases the upstream type and adds additional
                    helper methods
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
