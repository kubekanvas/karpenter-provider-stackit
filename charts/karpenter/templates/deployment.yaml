apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "karpenter.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "karpenter.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicas }}
  revisionHistoryLimit: 3
  strategy:
    rollingUpdate:
      maxUnavailable: 1
  selector:
    matchLabels:
      {{- include "karpenter.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "karpenter.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "karpenter.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if gt (int .Values.replicas) 1 }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- end }}
      # Karpenter has to be able to shut down promptly during a rollout; it holds no long-running
      # work of its own, and the leader election lease covers the handover.
      terminationGracePeriodSeconds: 30
      containers:
        - name: controller
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          env:
            - name: KUBERNETES_MIN_VERSION
              value: "1.19.0-0"
            - name: KARPENTER_SERVICE
              value: {{ include "karpenter.fullname" . }}
            - name: CLUSTER_NAME
              value: {{ required "settings.clusterName is required" .Values.settings.clusterName | quote }}
            - name: STACKIT_PROJECT_ID
              value: {{ required "settings.projectID is required" .Values.settings.projectID | quote }}
            - name: STACKIT_REGION
              value: {{ required "settings.region is required" .Values.settings.region | quote }}
            - name: VM_MEMORY_OVERHEAD_PERCENT
              value: {{ .Values.settings.vmMemoryOverheadPercent | quote }}
            - name: PRICING_OVERRIDES
              value: {{ .Values.settings.pricingOverrides | quote }}
            - name: DISABLE_DRY_RUN
              value: {{ .Values.settings.disableDryRun | quote }}
            - name: LOG_LEVEL
              value: {{ .Values.settings.logLevel | quote }}
            - name: BATCH_MAX_DURATION
              value: {{ .Values.settings.batchMaxDuration | quote }}
            - name: BATCH_IDLE_DURATION
              value: {{ .Values.settings.batchIdleDuration | quote }}
            - name: FEATURE_GATES
              value: "NodeRepair={{ .Values.settings.featureGates.nodeRepair }},ReservedCapacity={{ .Values.settings.featureGates.reservedCapacity }},SpotToSpotConsolidation={{ .Values.settings.featureGates.spotToSpotConsolidation }}"
            - name: HEALTH_PROBE_PORT
              value: {{ .Values.controller.healthProbe.port | quote }}
            - name: METRICS_PORT
              value: {{ .Values.controller.metrics.port | quote }}
            # Let the Go runtime size its heap against the container limit instead of the host.
            - name: MEMORY_LIMIT
              valueFrom:
                resourceFieldRef:
                  containerName: controller
                  divisor: "0"
                  resource: limits.memory
            {{- with .Values.controller.env }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          envFrom:
            - secretRef:
                name: {{ include "karpenter.credentialsSecretName" . }}
          ports:
            - name: http-metrics
              containerPort: {{ .Values.controller.metrics.port }}
              protocol: TCP
            - name: http
              containerPort: {{ .Values.controller.healthProbe.port }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 30
            timeoutSeconds: 30
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            timeoutSeconds: 30
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            # The root filesystem is read-only, so anything that writes needs an explicit mount.
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
