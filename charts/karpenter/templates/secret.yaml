{{- if not .Values.credentials.existingSecret }}
{{- if and (not .Values.credentials.serviceAccountKey) (not .Values.credentials.serviceAccountToken) }}
{{- fail "Set credentials.existingSecret, or credentials.serviceAccountKey, or credentials.serviceAccountToken" }}
{{- end }}
{{- if and .Values.credentials.serviceAccountKey .Values.credentials.serviceAccountToken }}
{{- fail "Set either credentials.serviceAccountKey or credentials.serviceAccountToken, not both" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "karpenter.credentialsSecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "karpenter.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- with .Values.credentials.serviceAccountKey }}
  STACKIT_SERVICE_ACCOUNT_KEY: {{ . | quote }}
  {{- end }}
  {{- with .Values.credentials.serviceAccountToken }}
  STACKIT_SERVICE_ACCOUNT_TOKEN: {{ . | quote }}
  {{- end }}
{{- end }}
