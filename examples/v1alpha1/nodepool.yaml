apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: default
spec:
  template:
    spec:
      nodeClassRef:
        group: karpenter.k8s.stackit
        kind: StackitNodeClass
        name: default
      requirements:
        # STACKIT sells no interruptible capacity, so on-demand is the only capacity type.
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["on-demand"]
        - key: kubernetes.io/arch
          operator: In
          values: ["amd64"]
        # Constrain by family and size rather than by machine type name, so new STACKIT machine
        # types are picked up automatically as they are added to the catalog.
        - key: karpenter.k8s.stackit/instance-family
          operator: In
          values: ["g1", "g2i", "c1a", "m1a"]
        - key: karpenter.k8s.stackit/instance-cpu
          operator: In
          values: ["2", "4", "8", "16"]
        # Spreading across availability zones is the useful default on STACKIT, which — unlike
        # UpCloud — has real zones inside a single region.
        - key: topology.kubernetes.io/zone
          operator: In
          values: ["eu01-1", "eu01-2"]
      expireAfter: 720h
  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 1m
  limits:
    cpu: "100"
    memory: 400Gi
